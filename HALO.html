<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HALO">
<meta name="theme-color" content="#050608">
<meta name="format-detection" content="telephone=no">
<title>HALO</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307080c'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23ffffff' stroke-opacity='.15' stroke-width='5'/%3E%3Cpath d='M47 22a18 18 0 0 1 2 14' fill='none' stroke='%235eead4' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='14' r='4' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --hue:168;
  --accent:hsl(var(--hue) 85% 66%);
  --bg:#050608;
  --ink:#eef1f6;
  --mute:rgba(238,241,246,.48);
  --faint:rgba(238,241,246,.28);
  --red:#ff7286;
  --cy:50vh;
  --r:140px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none}
body{
  position:fixed;inset:0;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;
}
#app{position:fixed;inset:0;overflow:hidden;animation:appIn 1s var(--ease) both}
@keyframes appIn{from{opacity:0}to{opacity:1}}

/* background */
#bg{position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(90vmax 60vmax at 50% var(--cy), hsl(var(--hue) 60% 50% / .055) 0%, transparent 55%),
    radial-gradient(70vmax 34vmax at 14% 12%, hsl(calc(var(--hue) + 70) 50% 45% / .045) 0%, transparent 70%),
    radial-gradient(80vmax 38vmax at 92% 88%, hsl(calc(var(--hue) - 50) 50% 45% / .04) 0%, transparent 70%),
    linear-gradient(118deg, transparent 22%, hsl(var(--hue) 30% 75% / .02) 50%, transparent 78%),
    radial-gradient(140% 90% at 50% -10%, #0c0e14 0%, transparent 60%),
    var(--bg);
}
#bg::after{content:"";position:absolute;inset:0;
  background:radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%);}
#c{position:absolute;inset:0;z-index:1;display:block}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;z-index:6;
  padding:calc(var(--sat) + 12px) calc(var(--sar) + 18px) 0 calc(var(--sal) + 22px);
  display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.chip{font-size:10px;letter-spacing:.24em;color:var(--mute);font-weight:600;display:flex;align-items:baseline}
.chip b{color:var(--ink);font-weight:500;margin-left:8px;letter-spacing:.02em;font-size:15px}
/* sound mode pill: icon + label, cycles HEADPHONES → SPEAKER → MUTE */
.sndbtn{pointer-events:auto;position:relative;height:38px;padding:0 15px 0 12px;border-radius:999px;
  display:inline-flex;align-items:center;gap:9px;cursor:pointer;outline:none;font:inherit;color:var(--ink);
  background:hsl(var(--hue) 40% 60% / .08);border:1px solid hsl(var(--hue) 85% 66% / .38);
  box-shadow:0 0 18px hsl(var(--hue) 85% 60% / .12);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transition:transform .25s var(--ease),background .3s,border-color .3s,box-shadow .3s,opacity .3s}
.sndbtn svg{color:var(--accent);flex:none}
.sndbtn g{display:none}
.sndbtn[data-mode="phones"] g[data-i="phones"],
.sndbtn[data-mode="speaker"] g[data-i="speaker"],
.sndbtn[data-mode="mute"] g[data-i="mute"]{display:inline}
#sndLbl{font-size:10px;font-weight:700;letter-spacing:.2em;white-space:nowrap}
.sndbtn[data-mode="mute"]{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.14);box-shadow:none}
.sndbtn[data-mode="mute"] svg{color:var(--mute)}
.sndbtn[data-mode="mute"] #sndLbl{color:var(--mute)}
.sndbtn.press{transform:scale(.92);background:hsl(var(--hue) 40% 60% / .16)}
.sndbtn.attn::after{content:"";position:absolute;inset:-1px;border-radius:inherit;border:1px solid var(--accent);
  animation:attn 2.2s var(--ease) infinite;pointer-events:none}
@keyframes attn{0%{opacity:.75;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.18,1.5)}}

/* hint / mode toast under the pill */
#sndTip{position:absolute;z-index:7;right:calc(var(--sar) + 18px);top:calc(var(--sat) + 62px);max-width:240px;
  padding:10px 14px;border-radius:14px;text-align:right;pointer-events:none;
  background:rgba(14,16,22,.78);border:1px solid hsl(var(--hue) 85% 66% / .25);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  opacity:0;transform:translateY(-6px);transition:opacity .35s var(--ease),transform .5s var(--ease)}
#sndTip.show{opacity:1;transform:none}
#sndTip::before{content:"";position:absolute;top:-5px;right:34px;width:9px;height:9px;transform:rotate(45deg);
  background:rgba(14,16,22,.95);border-left:1px solid hsl(var(--hue) 85% 66% / .25);border-top:1px solid hsl(var(--hue) 85% 66% / .25)}
#sndTip .t{display:block;font-size:12.5px;letter-spacing:.06em;color:var(--ink);font-weight:500}
#sndTip .d{display:block;margin-top:5px;font-size:10.5px;letter-spacing:.08em;color:var(--mute)}
#sndTip .d b{color:var(--accent);font-weight:600}

/* ring center */
#center{position:absolute;left:50%;top:var(--cy);z-index:4;pointer-events:none;
  width:calc(var(--r)*1.6);height:calc(var(--r)*1.6);transform:translate(-50%,-50%)}
.fade{transition:opacity .45s var(--ease)}
.off{opacity:0 !important}
#score{position:absolute;inset:0}
#score .lbl{position:absolute;left:0;right:0;top:calc(50% - var(--r)*.4);text-align:center;
  font-size:9px;letter-spacing:.6em;padding-left:.6em;color:var(--faint);font-weight:600}
#digits{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;justify-content:center;
  font-weight:200;font-size:calc(var(--r)*.42);line-height:1;font-variant-numeric:tabular-nums;
  text-shadow:0 0 30px hsl(var(--hue) 85% 66% / .28)}
#digits span{display:inline-block;width:.64em;text-align:center;transition:opacity .35s var(--ease)}
#digits span.z{opacity:.16;text-shadow:none}
#foot{position:absolute;left:0;right:0;top:calc(50% + var(--r)*.27);display:flex;flex-direction:column;align-items:center;gap:calc(var(--r)*.07)}
.rule{display:block;width:calc(var(--r)*.36);height:1px;
  background:linear-gradient(90deg,transparent,hsl(var(--hue) 85% 72% / .6),transparent)}
#logo{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
  font-weight:300;font-size:calc(var(--r)*.22);letter-spacing:.5em;padding-left:.5em;line-height:1}
#chord{min-height:1em;text-align:center;font-size:11px;letter-spacing:.18em;padding-left:.18em;
  color:var(--faint);font-weight:500;white-space:nowrap}

/* panels above / below the ring */
.panel{position:absolute;left:0;right:0;z-index:4;text-align:center;pointer-events:none;
  padding:0 calc(var(--sar) + 24px) 0 calc(var(--sal) + 24px)}
.above{bottom:calc(100% - var(--cy) + var(--r) + 58px)}
.below{top:calc(var(--cy) + var(--r) + 40px)}
.panel>*{transition:opacity .5s var(--ease),transform .7s var(--ease)}
.panel>*:nth-child(2){transition-delay:.07s}
.panel>*:nth-child(3){transition-delay:.14s}
.panel>*:nth-child(4){transition-delay:.21s}
.panel.hidden>*{opacity:0;transform:translateY(10px);transition-delay:0s;transition-duration:.25s}

.hint{font-size:14px;color:rgba(238,241,246,.84);letter-spacing:.08em;margin-bottom:30px;font-weight:400}
.cta{font-size:11px;letter-spacing:.42em;padding-left:.42em;font-weight:600;color:var(--ink)}
.cta span{display:inline-block;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.32}50%{opacity:1}}

.reason{font-size:11px;letter-spacing:.44em;padding-left:.44em;color:var(--red);font-weight:700}
.newbest{display:inline-block;margin-top:14px;padding:6px 12px 6px 15px;border-radius:999px;
  font-size:10px;letter-spacing:.32em;font-weight:800;color:#15110a;
  background:linear-gradient(100deg,#ffcf6e 0%,#fff4d6 40%,#ffc35a 60%,#ffcf6e 100%);background-size:220% 100%;
  animation:sheen 2.4s linear infinite;box-shadow:0 0 26px rgba(255,200,90,.32)}
@keyframes sheen{from{background-position:120% 0}to{background-position:-100% 0}}
.stats{display:flex;justify-content:center;gap:40px;margin-bottom:16px}
.stats div{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:56px}
.stats span{font-size:9.5px;letter-spacing:.26em;padding-left:.26em;color:var(--mute);font-weight:600}
.stats b{font-size:21px;font-weight:300;color:var(--ink)}
.song{font-size:11.5px;letter-spacing:.14em;color:var(--faint);margin-bottom:24px}

/* pause */
#pause{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:rgba(7,8,12,.55);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
#pause.show{opacity:1;pointer-events:auto}
#pause h2{font-size:12px;letter-spacing:.6em;padding-left:.6em;font-weight:600}

/* rotate hint for landscape phones */
#rotate{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:var(--bg);
  font-size:12px;letter-spacing:.3em;color:var(--mute)}
@media (orientation:landscape) and (max-height:500px){#rotate{display:flex}}
</style>
</head>
<body>
<div id="app">
  <div id="bg"></div>
  <canvas id="c"></canvas>

  <div id="hud">
    <div class="chip">BEST<b id="best">0</b></div>
    <button id="snd" class="sndbtn" data-btn data-mode="speaker" aria-label="サウンド切替">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <g data-i="phones"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4.5" height="7" rx="1.6"/><rect x="16.5" y="14" width="4.5" height="7" rx="1.6"/></g>
        <g data-i="speaker"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></g>
        <g data-i="mute"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></g>
      </svg>
      <span id="sndLbl">SPEAKER</span>
    </button>
  </div>
  <div id="sndTip" role="status" aria-live="polite"></div>

  <div id="center">
    <div id="logo" class="fade">HALO</div>
    <div id="score" class="fade off">
      <div class="lbl">HITS</div>
      <div id="digits"></div>
      <div id="foot"><i class="rule"></i><div id="chord" class="fade off"></div></div>
    </div>
  </div>

  <div id="mBelow" class="panel below">
    <p class="hint">光が弧に重なった時に、タップ。</p>
    <p class="cta"><span>TAP TO START</span></p>
  </div>

  <div id="oAbove" class="panel above hidden">
    <div id="reason" class="reason">MISSED</div>
    <div><span id="newbest" class="newbest">NEW BEST</span></div>
  </div>
  <div id="oBelow" class="panel below hidden">
    <div class="stats">
      <div><span>BEST</span><b id="sBest">0</b></div>
      <div><span>TIME</span><b id="sTime">0:00</b></div>
    </div>
    <p id="song" class="song">♪</p>
    <p class="cta"><span>TAP TO RETRY</span></p>
  </div>

  <div id="pause"><h2>PAUSED</h2><p class="cta"><span>TAP TO RESUME</span></p></div>
  <div id="rotate">縦向きでプレイしてください</div>
</div>

<script>
(() => {
'use strict';

/* ---------- utils ---------- */
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const wrap = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];
const mod7 = n => ((n % 7) + 7) % 7;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

const cvs = $('c'), ctx = cvs.getContext('2d');
const root = document.documentElement;
const el = {
  digits: $('digits'), scoreWrap: $('score'), logo: $('logo'), chord: $('chord'), best: $('best'),
  mBelow: $('mBelow'), oAbove: $('oAbove'), oBelow: $('oBelow'),
  reason: $('reason'), newbest: $('newbest'), sBest: $('sBest'), sTime: $('sTime'), song: $('song'),
  pause: $('pause'), snd: $('snd')
};

/* ---------- layout ---------- */
let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, R = 0, trackW = 0, orbR = 0;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  R = Math.min(W * 0.38, H * 0.235, 210);
  cx = W / 2; cy = H * 0.48;
  trackW = Math.max(10, R * 0.12);
  orbR = trackW * 0.58;
  root.style.setProperty('--cy', cy + 'px');
  root.style.setProperty('--r', R + 'px');
  fitScore();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------- sprites ---------- */
function makeGlow(rgb) {
  const s = 128, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d'), gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  gr.addColorStop(0, `rgba(${rgb},1)`); gr.addColorStop(.22, `rgba(${rgb},.5)`);
  gr.addColorStop(.55, `rgba(${rgb},.1)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0, 0, s, s); return c;
}
const GLOW_W = makeGlow('255,255,255'), GLOW_R = makeGlow('255,90,112');

/* =========================================================
   GENERATIVE MUSIC
   Each run picks a random key, mode and chord progression.
   Every hit = one melody note. 4 hits = 1 bar = 1 chord.
   The melody is a weighted random walk on the scale:
   mostly steps, leaps resolve back, strong beats land on
   chord tones, and bars sometimes echo the previous bar's
   contour (a motif) so it feels composed, not random.
   ========================================================= */
const FLAT_NAMES = ['C', 'D♭', 'D', 'E♭', 'E', 'F', 'G♭', 'G', 'A♭', 'A', 'B♭', 'B'];
const SHARP_NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
const MODE_OFFSET = { Ionian: 0, Dorian: 2, Lydian: 5, Mixolydian: 7, Aeolian: 9 }; // distance from parent major key
const MODES = {
  Ionian:     { s: [0, 2, 4, 5, 7, 9, 11], w: 3,   p: [[0, 3, 5, 3], [0, 4, 5, 3], [3, 4, 0, 5], [5, 3, 0, 4], [0, 5, 3, 4], [3, 0, 1, 4]] },
  Lydian:     { s: [0, 2, 4, 6, 7, 9, 11], w: 2.5, p: [[0, 1, 0, 1], [0, 1, 2, 1], [0, 4, 5, 1], [0, 1, 5, 4]] },
  Mixolydian: { s: [0, 2, 4, 5, 7, 9, 10], w: 1,   p: [[0, 6, 3, 0], [0, 4, 6, 3], [6, 3, 0, 0]] },
  Dorian:     { s: [0, 2, 3, 5, 7, 9, 10], w: 1.5, p: [[0, 3, 0, 3], [0, 6, 2, 3], [2, 3, 0, 6]] },
  Aeolian:    { s: [0, 2, 3, 5, 7, 8, 10], w: 2,   p: [[0, 5, 2, 6], [0, 3, 5, 6], [5, 6, 0, 0], [0, 5, 3, 4]] }
};
const MEL_LO = 0, MEL_HI = 7;            // melody range in scale steps: tonic up to its octave
const STEP_W = [.3, 3, 2.3, 1.1, .8, .45]; // preference by interval size (0..5 steps)
// Register / voice profile per output. Both play the same pitches; the speaker profile drops the bass line and
// the sub-octave layer (a phone speaker can't reproduce them) and uses a slightly brighter voice.
const REG = {
  phones:  { tonic: 52, pad: 45, bass: 36,   det: .35, sub: .1, h2: .09, lpA: 2200, lpB: 1300, padLp: 620,  vel: 1 },
  speaker: { tonic: 52, pad: 45, bass: null, det: 0,   sub: 0,  h2: .16, lpA: 3400, lpB: 2100, padLp: 1500, vel: .8 }
};
const reg = () => REG[Sound.mode === 'speaker' ? 'speaker' : 'phones'];

const Song = {
  newSong() {
    const names = Object.keys(MODES);
    let r = Math.random() * names.reduce((a, n) => a + MODES[n].w, 0);
    this.modeName = names[names.length - 1];
    for (const n of names) { r -= MODES[n].w; if (r <= 0) { this.modeName = n; break; } }
    this.mode = MODES[this.modeName];
    this.tpc = (Math.random() * 12) | 0;                              // key (pitch class) is random,
    this.place();                                                     // octave depends on the output mode
    const parent = ((this.tpc - MODE_OFFSET[this.modeName]) % 12 + 12) % 12;
    this.names = [2, 4, 6, 7, 9, 11].includes(parent) ? SHARP_NAMES : FLAT_NAMES;   // spell like the key signature
    this.prog = pick(this.mode.p);
    this.ci = 0; this.beat = 0;
    this.m = pick([0, 2, 4]); this.dir = Math.random() < .5 ? 1 : -1;
    this.curBar = []; this.replay = [];
  },
  place() { const b = reg().tonic; this.tonic = b + ((this.tpc - b) % 12 + 12) % 12; },   // tonic E3–D#4
  chord() { return this.prog[this.ci]; },
  pc(step) { return (this.tonic + this.mode.s[mod7(step)]) % 12; },
  midiOf(s) { return this.tonic + 12 * Math.floor(s / 7) + this.mode.s[mod7(s)]; },
  chordIv() {
    const c = this.chord(), sc = this.mode.s, r = sc[mod7(c)];
    const iv = k => ((sc[mod7(c + k)] - r) % 12 + 12) % 12;
    return [0, iv(2), iv(4), iv(6)];
  },
  chordName() {
    const [, third, fifth, sev] = this.chordIv();
    const q = third === 4 ? (sev === 11 ? 'maj7' : '7') : (fifth === 6 ? 'm7♭5' : 'm7');
    return this.names[this.pc(this.chord())] + q;
  },
  keyName() { return this.names[this.tonic % 12] + ' ' + this.modeName; },
  padMidis() {   // stacked voicing (root, 3rd, 5th, 7th); root in 45..56 (phones) or 55..66 (speaker)
    const rp = this.pc(this.chord()), b = reg().pad, rootM = b + ((rp - b) % 12 + 12) % 12;
    return this.chordIv().map(i => rootM + i);
  },
  bassMidi() { const b = reg().bass; if (b == null) return null; const rp = this.pc(this.chord()); return b + ((rp - b) % 12 + 12) % 12; },
  choose(pos, beat) {
    const c = this.chord(), strong = pos === 0 || beat % 8 === 7;
    const tri = [mod7(c), mod7(c + 2), mod7(c + 4)], sev = mod7(c + 6);
    const cand = []; let tot = 0;
    for (let dl = -5; dl <= 5; dl++) {
      const s = this.m + dl; if (s < MEL_LO || s > MEL_HI) continue;
      const cl = mod7(s), isT = tri.includes(cl), is7 = cl === sev;
      let w = STEP_W[Math.abs(dl)];

const HUES = [168, 192, 218, 256, 292, 330, 14, 140];

  pulses.push({ type: 'local', x, y, t: 0, life: .45 });
  flash = .8;
  shake = reduceMotion ? 0 : 1.8;
  haptic();

  if (hits % 10 === 0) pulses.push({ type: 'level', t: 0, life: 1.1 });
  dir *= -1;
  spawnTarget(false);
}

function fail(reason) {
  if (state !== 'play') return;
  const { x, y } = orbPos();
  state = 'dying'; dyingT = 0; deathReason = reason; overShown = false;
  shake = reduceMotion ? 0 : 12; redFlash = 1;
  burst(x, y, 28, 'red', 1.3);
  pulses.push({ type: 'local', x, y, t: 0, life: .7, big: true, red: true });
  el.chord.classList.add('off');
  Sound.fail(); haptic();
}

function showOver() {
  overShown = true; state = 'over'; overAt = performance.now();
  const isNew = score > best;
  if (isNew) { best = score; store.set('halo.best', best); }
  el.best.textContent = best;
  el.reason.textContent = deathReason === 'early' ? 'TOO EARLY' : 'MISSED';
  el.newbest.style.display = isNew && score > 0 ? '' : 'none';
  el.sBest.textContent = best;
  const sec = Math.floor(playTime);
  el.sTime.textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  el.song.textContent = '♪ ' + Song.keyName();
  setMode('over');
}

function demoHit() {
  const { x, y } = orbPos();
  pulses.push({ type: 'local', x, y, t: 0, life: .45 });
  pulses.push({ type: 'ring', t: 0, life: .6, strength: .45 });
  burst(x, y, 8, 'acc', .6);
  flash = .4; dir *= -1; spawnTarget(false);
}

/* ---------- update ---------- */
function update(dt, now) {
  const hIdx = state === 'menu' ? 0 : Math.floor(hits / 10) % HUES.length;
  const dh = ((HUES[hIdx] - hueCur + 540) % 360) - 180;
  hueCur = (hueCur + dh * Math.min(1, dt * 2.2) + 360) % 360;
  if (Math.abs(hueCur - hueSet) > .4) { hueSet = hueCur; root.style.setProperty('--hue', hueCur.toFixed(1)); }

  shake *= Math.pow(.0008, dt); if (shake < .05) shake = 0;
  flash = Math.max(0, flash - dt * 3.2);
  redFlash = Math.max(0, redFlash - dt * 1.5);
  dimV += ((state === 'over' ? 1 : 0) - dimV) * Math.min(1, dt * 5);
  if (paused) return;

  if (state === 'play') playTime += dt;
  if (state === 'dying') {
    timeScale = Math.max(0, timeScale - dt * 5);
    dyingT += dt;
    if (dyingT > .8 && !overShown) showOver();
  }
  const sdt = dt * timeScale;
  gameTime += sdt;
  if (sdt > 0) {
    ang = wrap(ang + dir * spd * sdt);
    if (target) {
      target.t += sdt;
      target.rem -= spd * sdt;                         // distance to the arc's spawn point
      target.eff = target.rem + dir * arcOffset(target); // forward distance from orb to arc centre
      target.a = wrap(ang + dir * target.eff);
    }
    trail.push({ a: ang, t: gameTime });
  }
  while (trail.length && (gameTime - trail[0].t > .14 || trail.length > 48)) trail.shift();
  decoRot += dir * spd * .045 * sdt + dt * .02;

  if (state === 'play') {
    if (target.eff < -(target.hw + tolA() + HIT_GRACE)) fail('pass');
  } else if (state === 'menu') {
    if (target.eff < target.hw * .1) demoHit();
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.t += dt;
    if (p.t >= p.life) { particles.splice(i, 1); continue; }
    const dr = Math.pow(.02, dt); p.vx *= dr; p.vy *= dr; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = pulses.length - 1; i >= 0; i--) { const p = pulses[i]; p.t += dt; if (p.t >= p.life) pulses.splice(i, 1); }
}

/* ---------- render ---------- */
function drawArc(t, h, s, l, now, alpha) {
  const age = (now - t.born) / 1000; if (age < 0) return;
  const hw = t.hw * easeOutBack(clamp(age / .32, 0, 1));
  if (hw <= .002) return;
  const near = clamp(1 - Math.abs(t.eff) / 1.1, 0, 1);
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx, cy, R, t.a - hw, t.a + hw);
  ctx.lineWidth = trackW * 2.5; ctx.strokeStyle = hsl(h, s, l, (.06 + .12 * near) * alpha); ctx.stroke();
  ctx.lineWidth = trackW * 1.55; ctx.strokeStyle = hsl(h, s, l, (.12 + .14 * near) * alpha); ctx.stroke();
  ctx.lineWidth = trackW; ctx.strokeStyle = hsl(h, s, l, .94 * alpha); ctx.stroke();
  // soft inner highlight (decorative only)
  ctx.beginPath(); ctx.arc(cx, cy, R - trackW * .18, t.a - hw * .85, t.a + hw * .85);
  ctx.lineWidth = trackW * .18; ctx.strokeStyle = `rgba(255,255,255,${(.12 + .18 * near) * alpha})`; ctx.stroke();
}

// minimal dial: one hairline circle with a ring of fine dots (turning with the orb),
// four accent points, and a single counter-rotating inner circle. Lifts softly on each hit.
function drawDial(dim) {
  const glow = 1 + flash * .6, w = (a) => `rgba(255,255,255,${a * dim * glow})`;
  const r0 = R + trackW * 1.1, rd = r0 + trackW * .55;
  ctx.save(); ctx.translate(cx, cy);

  ctx.save(); ctx.rotate(decoRot);
  ctx.beginPath(); ctx.arc(0, 0, r0, 0, TAU);
  ctx.lineWidth = .8; ctx.strokeStyle = w(.13); ctx.stroke();
  for (let i = 0; i < 72; i++) {
    if (i % 18 === 0) continue;
    const a = i / 72 * TAU, major = i % 6 === 0;
    ctx.fillStyle = w(major ? .55 : .28);
    ctx.beginPath(); ctx.arc(Math.cos(a) * rd, Math.sin(a) * rd, major ? 1.2 : .75, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = hsl(hueCur, 80, 74, .85 * dim);
  for (let i = 0; i < 4; i++) {
    const a = i / 4 * TAU;
    ctx.beginPath(); ctx.arc(Math.cos(a) * rd, Math.sin(a) * rd, 1.8, 0, TAU); ctx.fill();
  }
  ctx.restore();

  const ri = R - trackW * 1.15;
  ctx.save(); ctx.rotate(-decoRot * .6);
  ctx.beginPath(); ctx.arc(0, 0, ri, 0, TAU);
  ctx.lineWidth = .8; ctx.strokeStyle = w(.08); ctx.stroke();
  ctx.fillStyle = w(.28);
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * TAU;
    ctx.beginPath(); ctx.arc(Math.cos(a) * ri, Math.sin(a) * ri, .9, 0, TAU); ctx.fill();
  }
  ctx.restore();

  ctx.restore();
}

function render(now) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);


  if (shake > 0) ctx.translate((Math.random() * 2 - 1) * shake, (Math.random() * 2 - 1) * shake);
  const dim = 1 - dimV * .6;
  const dead = state === 'dying' || state === 'over';

  drawDial(dim);

  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU);
  ctx.lineWidth = trackW; ctx.strokeStyle = `rgba(255,255,255,${.055 * dim})`; ctx.stroke();
  if (flash > 0) { ctx.strokeStyle = hsl(hueCur, 85, 66, flash * .16); ctx.stroke(); }

  for (const p of pulses) {
    const k = p.t / p.life, e = easeOut(k);
    if (p.type === 'ring') {
      ctx.beginPath(); ctx.arc(cx, cy, R + e * trackW * 3.4 * p.strength, 0, TAU);
      ctx.lineWidth = Math.max(.5, trackW * (1 - k) * .8);
      ctx.strokeStyle = hsl(hueCur, 85, 66, (1 - k) * .5 * p.strength);
      ctx.stroke();
    } else if (p.type === 'level') {
      ctx.beginPath(); ctx.arc(cx, cy, R * (1 + e * .9), 0, TAU);
      ctx.lineWidth = 1.5; ctx.strokeStyle = hsl(hueCur, 85, 70, (1 - k) * .35); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, R * (1 - e * .35), 0, TAU);
      ctx.lineWidth = 1; ctx.strokeStyle = hsl(hueCur, 85, 70, (1 - k) * .2); ctx.stroke();
    }
  }

  if (target) {
    let alpha = dim;
    if (dead) alpha *= .45 + .45 * (.5 + .5 * Math.sin(now * .012));
    drawArc(target, hueCur, 85, 66, now, alpha);
  }

  if (trail.length > 1) {
    ctx.lineCap = 'round';
    const n = trail.length;
    for (let i = 1; i < n; i++) {
      const k = i / n, p0 = trail[i - 1], p1 = trail[i];
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(p0.a) * R, cy + Math.sin(p0.a) * R);
      ctx.lineTo(cx + Math.cos(p1.a) * R, cy + Math.sin(p1.a) * R);
      ctx.lineWidth = orbR * 1.9 * k;
      ctx.strokeStyle = dead ? `rgba(255,110,130,${k * k * .3})` : hsl(hueCur, 90, 86, k * k * .38);
      ctx.stroke();
    }
  }

  const ox = cx + Math.cos(ang) * R, oy = cy + Math.sin(ang) * R;
  ctx.globalCompositeOperation = 'lighter';
  const gs = orbR * (dead ? 9 : 7.5) * (1 + flash * .3);
  ctx.globalAlpha = .55;
  ctx.drawImage(dead ? GLOW_R : GLOW_W, ox - gs / 2, oy - gs / 2, gs, gs);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.beginPath(); ctx.arc(ox, oy, orbR, 0, TAU);
  ctx.fillStyle = dead ? '#ff6a7c' : '#ffffff'; ctx.fill();

  ctx.globalCompositeOperation = 'lighter';
  for (const p of pulses) {
    if (p.type !== 'local') continue;
    const k = p.t / p.life, e = easeOut(k);
    ctx.beginPath(); ctx.arc(p.x, p.y, orbR * (1.2 + e * 3.6 * (p.big ? 1.7 : 1)), 0, TAU);
    ctx.lineWidth = 2 * (1 - k);
    ctx.strokeStyle = p.red ? `rgba(255,100,120,${1 - k})` : hsl(hueCur, 85, 72, 1 - k);
    ctx.stroke();
  }
  for (const p of particles) {
    const k = 1 - p.t / p.life;
    ctx.fillStyle = `hsla(${p.h.toFixed(1)},${p.s}%,${p.l}%,${k})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (.4 + .6 * k), 0, TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  if (redFlash > .01) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const g = ctx.createRadialGradient(cx, cy, R * .5, cx, cy, Math.max(W, H) * .8);
    g.addColorStop(0, 'rgba(255,60,85,0)'); g.addColorStop(1, `rgba(255,60,85,${redFlash * .3})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
}

/* ---------- loop ---------- */
function frame(now) {
  let dt = (now - lastT) / 1000; if (dt > .05) dt = .05; if (dt < 0) dt = 0;
  update(dt, now);
  lastT = now;
  render(now);
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
function onPress(e) {
  if (e && e.target && e.target.closest && e.target.closest('[data-btn]')) return;
  if (e && e.button > 0) return;
  Sound.init();
  if (paused) { paused = false; el.pause.classList.remove('show'); lastT = performance.now(); return; }
  if (state === 'menu') { startGame(); return; }
  if (state === 'play') { tap(); return; }
  if (state === 'over' && performance.now() - overAt > 550) startGame();
}
window.addEventListener('pointerdown', onPress, { passive: true });
document.addEventListener('touchstart', e => { if (!(e.target.closest && e.target.closest('[data-btn]'))) e.preventDefault(); }, { passive: false });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('touchend', () => Sound.init(), { passive: true });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); onPress({ target: document.body }); }
});

/* sound mode button + discoverability:
   - the pill always shows the current mode in words
   - until the player has used it once, it pulses and a hint bubble explains it (menu / result screens only)
   - each switch shows a short toast and plays a preview chime in the new mode */
const SND_LABEL = { phones: 'HEADPHONES', speaker: 'SPEAKER', mute: 'MUTE' };
const SND_JA = { phones: 'ヘッドホン', speaker: 'スピーカー', mute: 'ミュート' };
const SND_DESC = { phones: 'イヤホン・ヘッドホン向け。低音まで深く響きます', speaker: 'スマートフォン・タブレット本体のスピーカー向け', mute: 'サウンドをオフにしました' };
const sndTip = $('sndTip'), sndLbl = $('sndLbl');
let sndTouched = false, tipTimer = 0, tipMode = '', uiMode = 'menu';   // sndTouched: used the button this session
function syncSnd() {
  el.snd.dataset.mode = Sound.mode;
  sndLbl.textContent = SND_LABEL[Sound.mode];
  el.snd.setAttribute('aria-label', 'サウンド：' + SND_JA[Sound.mode] + '（タップで切替）');
}
// The hint is always shown on the title screen (every launch); the pulse stops once the button is used.
function updateSndHint(mode) {
  if (mode) uiMode = mode;
  if (tipMode === 'toast') return;
  const show = uiMode === 'menu';
  el.snd.classList.toggle('attn', show && !sndTouched);
  if (show) {
    sndTip.innerHTML = '<span class="t">タップで音の出力を切替</span><span class="d">' +
      SND_MODES.map(m => m === Sound.mode ? `<b>${SND_JA[m]}</b>` : SND_JA[m]).join(' → ') + '</span>';
    tipMode = 'hint';
  } else if (tipMode === 'hint') tipMode = '';
  sndTip.classList.toggle('show', show);
}
function showSndToast() {
  sndTip.innerHTML = `<span class="t">${SND_JA[Sound.mode]}</span><span class="d">${SND_DESC[Sound.mode]}</span>`;
  sndTip.classList.add('show'); tipMode = 'toast';
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => { sndTip.classList.remove('show'); tipMode = ''; setTimeout(() => updateSndHint(), 380); }, 1900);
}
el.snd.addEventListener('pointerdown', () => el.snd.classList.add('press'));
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => el.snd.addEventListener(t, () => el.snd.classList.remove('press')));
el.snd.addEventListener('click', e => {
  e.stopPropagation();
  Sound.init();
  Sound.setMode(SND_MODES[(SND_MODES.indexOf(Sound.mode) + 1) % SND_MODES.length]);
  syncSnd();
  if (Sound.on) Sound.preview();
  haptic();
  sndTouched = true; el.snd.classList.remove('attn');
  showSndToast();
});

function goBackground() {
  if (state === 'play') { paused = true; el.pause.classList.add('show'); }
  if (Sound.ctx && Sound.ctx.suspend) Sound.ctx.suspend().catch(() => {});
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) goBackground();
  else { lastT = performance.now(); if (Sound.ctx && Sound.on) Sound.ctx.resume().catch(() => {}); }
});
window.addEventListener('pagehide', goBackground);

/* ---------- boot ---------- */
resize();
el.best.textContent = best;
syncSnd();
setMode('menu');
spawnTarget(false);
requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });
})();
</script>
</body>
